<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris Clássico</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            touch-action: none;
        }
        #game-canvas {
            border: 4px solid #334155;
            background-color: #1e293b;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            max-width: 100%;
            max-height: 70vh;
        }
        .controls-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            max-width: 200px;
        }
        .btn-control {
            background: #334155;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            user-select: none;
        }
        .btn-control:active {
            background: #475569;
            transform: scale(0.95);
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-md flex flex-col gap-6">
        <!-- Cabeçalho e Pontuação -->
        <div class="flex justify-between items-end">
            <div>
                <h1 class="text-3xl font-bold text-blue-400">TETRIS</h1>
                <p class="text-slate-400 text-sm">Desafia os teus limites</p>
            </div>
            <div class="text-right">
                <div class="text-xs uppercase tracking-widest text-slate-500">Pontos</div>
                <div id="score" class="text-2xl font-mono font-bold">0</div>
            </div>
        </div>

        <!-- Área do Jogo -->
        <div class="relative flex justify-center">
            <canvas id="game-canvas"></canvas>
            
            <!-- Overlay de Game Over -->
            <div id="game-over" class="hidden absolute inset-0 bg-slate-900/80 flex flex-col items-center justify-center text-center p-6 rounded">
                <h2 class="text-4xl font-black text-red-500 mb-2">FIM DE JOGO</h2>
                <p id="final-score-display" class="mb-6">Pontuação Final: 0</p>
                <button onclick="resetGame()" class="bg-blue-600 hover:bg-blue-500 px-6 py-3 rounded-full font-bold transition-all">
                    Tentar Novamente
                </button>
            </div>

            <!-- Botão Start Inicial -->
            <div id="start-screen" class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center">
                <button onclick="startGame()" class="bg-emerald-600 hover:bg-emerald-500 px-8 py-4 rounded-full font-bold text-xl shadow-lg transition-all transform hover:scale-105">
                    COMEÇAR JOGO
                </button>
            </div>
        </div>

        <!-- Controlos Mobile -->
        <div class="md:hidden flex flex-col items-center gap-4">
            <div class="controls-grid">
                <div></div>
                <div class="btn-control" onpointerdown="playerRotate()">↻</div>
                <div></div>
                <div class="btn-control" onpointerdown="playerMove(-1)">←</div>
                <div class="btn-control" onpointerdown="playerDrop()">↓</div>
                <div class="btn-control" onpointerdown="playerMove(1)">→</div>
            </div>
        </div>

        <!-- Dicas Desktop -->
        <div class="hidden md:block text-slate-500 text-sm text-center">
            Use as setas <span class="text-slate-300">← →</span> para mover, <span class="text-slate-300">↑</span> para rodar e <span class="text-slate-300">↓</span> para descer rápido.
        </div>
    </div>

    <script>
        const canvas = document.getElementById('game-canvas');
        const context = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const gameOverScreen = document.getElementById('game-over');
        const startScreen = document.getElementById('start-screen');

        // Configurações do Grid
        const ROW = 20;
        const COL = 10;
        const SQ = 30; // Tamanho do quadrado em pixels
        
        canvas.width = COL * SQ;
        canvas.height = ROW * SQ;

        // Cores das Peças (Tetrominos)
        const COLORS = [
            null,
            '#FF0D72', // T
            '#0DC2FF', // I
            '#0DFF72', // S
            '#F538FF', // Z
            '#FF8E0D', // L
            '#FFE138', // O
            '#3877FF'  // J
        ];

        // Definição das Peças
        function createPiece(type) {
            if (type === 'I') {
                return [
                    [0, 1, 0, 0],
                    [0, 1, 0, 0],
                    [0, 1, 0, 0],
                    [0, 1, 0, 0],
                ];
            } else if (type === 'L') {
                return [
                    [0, 2, 0],
                    [0, 2, 0],
                    [0, 2, 2],
                ];
            } else if (type === 'J') {
                return [
                    [0, 3, 0],
                    [0, 3, 0],
                    [3, 3, 0],
                ];
            } else if (type === 'O') {
                return [
                    [4, 4],
                    [4, 4],
                ];
            } else if (type === 'Z') {
                return [
                    [5, 5, 0],
                    [0, 5, 5],
                    [0, 0, 0],
                ];
            } else if (type === 'S') {
                return [
                    [0, 6, 6],
                    [6, 6, 0],
                    [0, 0, 0],
                ];
            } else if (type === 'T') {
                return [
                    [0, 7, 0],
                    [7, 7, 7],
                    [0, 0, 0],
                ];
            }
        }

        // Arena (Tabuleiro)
        function createMatrix(w, h) {
            const matrix = [];
            while (h--) {
                matrix.push(new Array(w).fill(0));
            }
            return matrix;
        }

        let arena = createMatrix(COL, ROW);

        const player = {
            pos: {x: 0, y: 0},
            matrix: null,
            score: 0,
        };

        // Desenhar a Peça e o Tabuleiro
        function draw() {
            // Limpar fundo
            context.fillStyle = '#1e293b';
            context.fillRect(0, 0, canvas.width, canvas.height);

            drawMatrix(arena, {x: 0, y: 0});
            drawMatrix(player.matrix, player.pos);
        }

        function drawMatrix(matrix, offset) {
            matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        // Sombra/Borda interna
                        context.fillStyle = COLORS[value];
                        context.fillRect((x + offset.x) * SQ, (y + offset.y) * SQ, SQ, SQ);
                        
                        // Brilho superior
                        context.fillStyle = 'rgba(255,255,255,0.2)';
                        context.fillRect((x + offset.x) * SQ, (y + offset.y) * SQ, SQ, 2);
                        // Sombra inferior
                        context.fillStyle = 'rgba(0,0,0,0.2)';
                        context.fillRect((x + offset.x) * SQ, (y + offset.y) * SQ + SQ - 2, SQ, 2);
                        
                        // Moldura externa
                        context.strokeStyle = '#0f172a';
                        context.lineWidth = 1;
                        context.strokeRect((x + offset.x) * SQ, (y + offset.y) * SQ, SQ, SQ);
                    }
                });
            });
        }

        // Colisões
        function collide(arena, player) {
            const [m, o] = [player.matrix, player.pos];
            for (let y = 0; y < m.length; ++y) {
                for (let x = 0; x < m[y].length; ++x) {
                    if (m[y][x] !== 0 &&
                       (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) {
                        return true;
                    }
                }
            }
            return false;
        }

        // Mesclar peça parada na arena
        function merge(arena, player) {
            player.matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        arena[y + player.pos.y][x + player.pos.x] = value;
                    }
                });
            });
        }

        // Rodar matriz
        function rotate(matrix, dir) {
            for (let y = 0; y < matrix.length; ++y) {
                for (let x = 0; x < y; ++x) {
                    [
                        matrix[x][y],
                        matrix[y][x],
                    ] = [
                        matrix[y][x],
                        matrix[x][y],
                    ];
                }
            }
            if (dir > 0) {
                matrix.forEach(row => row.reverse());
            } else {
                matrix.reverse();
            }
        }

        // Lógica de Movimento
        function playerDrop() {
            player.pos.y++;
            if (collide(arena, player)) {
                player.pos.y--;
                merge(arena, player);
                playerReset();
                arenaSweep();
                updateScore();
            }
            dropCounter = 0;
        }

        function playerMove(dir) {
            player.pos.x += dir;
            if (collide(arena, player)) {
                player.pos.x -= dir;
            }
        }

        function playerRotate() {
            const pos = player.pos.x;
            let offset = 1;
            rotate(player.matrix, 1);
            while (collide(arena, player)) {
                player.pos.x += offset;
                offset = -(offset + (offset > 0 ? 1 : -1));
                if (offset > player.matrix[0].length) {
                    rotate(player.matrix, -1);
                    player.pos.x = pos;
                    return;
                }
            }
        }

        function playerReset() {
            const pieces = 'ILJOTSZ';
            player.matrix = createPiece(pieces[pieces.length * Math.random() | 0]);
            player.pos.y = 0;
            player.pos.x = (arena[0].length / 2 | 0) -
                           (player.matrix[0].length / 2 | 0);
            
            if (collide(arena, player)) {
                gameOver();
            }
        }

        function arenaSweep() {
            let rowCount = 1;
            outer: for (let y = arena.length - 1; y > 0; --y) {
                for (let x = 0; x < arena[y].length; ++x) {
                    if (arena[y][x] === 0) {
                        continue outer;
                    }
                }
                const row = arena.splice(y, 1)[0].fill(0);
                arena.unshift(row);
                ++y;

                player.score += rowCount * 10;
                rowCount *= 2;
            }
        }

        function updateScore() {
            scoreElement.innerText = player.score;
        }

        function gameOver() {
            isPaused = true;
            gameOverScreen.classList.remove('hidden');
            document.getElementById('final-score-display').innerText = `Pontuação Final: ${player.score}`;
        }

        function resetGame() {
            arena.forEach(row => row.fill(0));
            player.score = 0;
            updateScore();
            gameOverScreen.classList.add('hidden');
            playerReset();
            isPaused = false;
        }

        function startGame() {
            startScreen.classList.add('hidden');
            resetGame();
            update();
        }

        // Loop do Jogo
        let dropCounter = 0;
        let dropInterval = 1000;
        let lastTime = 0;
        let isPaused = true;

        function update(time = 0) {
            if (isPaused) return;

            const deltaTime = time - lastTime;
            lastTime = time;

            dropCounter += deltaTime;
            if (dropCounter > dropInterval) {
                playerDrop();
            }

            draw();
            requestAnimationFrame(update);
        }

        // Eventos de Teclado
        document.addEventListener('keydown', event => {
            if (isPaused) return;
            
            if (event.keyCode === 37) { // Esquerda
                playerMove(-1);
            } else if (event.keyCode === 39) { // Direita
                playerMove(1);
            } else if (event.keyCode === 40) { // Baixo
                playerDrop();
            } else if (event.keyCode === 38) { // Cima (Rodar)
                playerRotate();
            }
        });

        // Inicializar com uma peça mas pausado
        playerReset();
        draw();

    </script>
</body>
</html>
